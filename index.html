
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a13">
  <title>Skogskart</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { color-scheme: dark; --bg:#101a13; --panel:#17251b; --line:#34473a; --muted:#aab7aa; --text:#f2f5ef; --accent:#8cae82; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { display:flex; flex-direction:column; overflow:hidden; }
    header { flex:0 0 auto; min-height:76px; padding: max(12px, env(safe-area-inset-top)) 18px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:#0d1710; border-bottom:1px solid #253529; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:850; font-size:clamp(21px,5vw,31px); letter-spacing:2px; }
    .brand span:first-child { font-size:29px; }
    .tagline { color:#879487; font-size:12px; text-align:right; letter-spacing:.5px; }
    #map { flex:1 1 auto; min-height:0; width:100%; background:#d4d8c6; }
    footer { flex:0 0 auto; padding:10px 10px max(12px, env(safe-area-inset-bottom)); background:#0d1710; border-top:1px solid #253529; }
    .toolbar { display:grid; grid-template-columns:1.35fr .8fr 1fr .8fr; gap:8px; }
    button { border:1px solid #425546; background:#1c2b20; color:#f2f5ef; border-radius:15px; min-height:57px; padding:9px 7px; font-size:14px; font-weight:700; cursor:pointer; -webkit-tap-highlight-color:transparent; }
    button:active { transform:scale(.98); }
    button.active { border-color:#a6c398; background:#344b37; }
    #status { margin-top:8px; min-height:22px; padding:7px 10px; border-radius:9px; background:rgba(9,17,11,.88); color:#d3ded1; font-size:12px; line-height:1.35; }
    #status:empty { display:none; }
    .leaflet-popup-content-wrapper,.leaflet-popup-tip { background:#1b2a20; color:#f2f5ef; }
    .leaflet-popup-content { margin:12px 14px; line-height:1.45; min-width:180px; }
    .popup-title { font-weight:800; margin-bottom:6px; }
    .popup-muted { color:#c0cbbf; font-size:12px; }
    .popup-action { margin-top:8px; min-height:34px; width:100%; border-radius:8px; padding:6px; font-size:13px; }
    .leaflet-control-attribution { font-size:10px !important; }
    .legend { display:flex; flex-wrap:wrap; gap:7px 12px; margin-top:8px; color:#c7d0c5; font-size:11px; }
    .legend-item { display:flex; align-items:center; gap:5px; }
    .swatch { width:17px; height:4px; border-radius:4px; display:inline-block; }
    .pin-dot { width:10px; height:10px; border-radius:50%; display:inline-block; border:1px solid white; }
    @media (max-width:390px) { button { font-size:12px; min-height:53px; } .toolbar { gap:6px; } header { min-height:68px; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span>🌲</span><span>SKOGSKART</span></div>
    <div class="tagline">DITT TURKART · NORGE</div>
  </header>

  <main id="map" aria-label="Kart"></main>

  <footer>
    <div class="toolbar">
      <button id="addPinBtn">📍 Lagre plass</button>
      <button id="gpsBtn">◎ GPS</button>
      <button id="layersBtn">🗺️ Kartlag</button>
      <button id="roadsBtn">🛣️ Veier</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div class="legend" id="legend" hidden>
      <span class="legend-item"><i class="swatch" style="background:#d94b43"></i> E/R – europavei/riksvei</span>
      <span class="legend-item"><i class="swatch" style="background:#e5a13b"></i> F – fylkesvei</span>
      <span class="legend-item"><i class="swatch" style="background:#53a0d8"></i> K – kommunal</span>
      <span class="legend-item"><i class="swatch" style="background:#54b477"></i> P/S &ndash; privat / skogsbilveg</span>
      <span class="legend-item"><i class="swatch" style="background:#a8a8a8"></i> Ukjent/annen</span>
      <span class="legend-item">Privat betyr ikke automatisk stengt. Sjekk skilt og lokale regler.</span>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="nvdb.js"></script>
  <script>
  (() => {
    'use strict';

    // Kartet starter ved Birkeland. NVDB-hentingen bruker alltid det synlige kartutsnittet.
    const START = [58.3308, 8.2323];
    const STORAGE_KEY = 'skogskart';
    const NVDB_SEGMENT_URL = 'https://nvdbapiles.atlas.vegvesen.no/vegnett/api/v4/veglenkesekvenser/segmentert';
    const NVDB_HEADERS = {
      'Accept': 'application/json',
      'X-Client': 'Skogskart foldym.github.io'
    };

    const map = L.map('map', { zoomControl:true, preferCanvas:true }).setView(START, 12);
    const topoLayer = L.tileLayer.wms('https://wms.geonorge.no/skwms1/wms.topo', {
      layers:'topo', format:'image/png', transparent:false, version:'1.3.0',
      attribution:'Kartverket / Geonorge'
    });
    const satelliteLayer = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom:19, attribution:'Tiles © Esri' }
    );
    topoLayer.addTo(map);

    const statusEl = document.getElementById('status');
    const addPinBtn = document.getElementById('addPinBtn');
    const gpsBtn = document.getElementById('gpsBtn');
    const layersBtn = document.getElementById('layersBtn');
    const roadsBtn = document.getElementById('roadsBtn');
    const legendEl = document.getElementById('legend');

    let addingPin = false;
    let roadsEnabled = false;
    let roadLayer = L.geoJSON([], {
      style: feature => roadStyle(feature.properties || {}),
      onEachFeature: (feature, layer) => {
        const p = feature.properties || {};
        const title = p.roadName || p.reference || 'Veg fra NVDB';
        const details = [
          p.roadCategory ? `Vegkategori: ${p.roadCategory}` : '',
          p.roadType ? `Vegtype: ${p.roadType}` : '',
          p.reference ? `Vegreferanse: ${p.reference}` : '',
          p.roadName ? `Navn: ${p.roadName}` : '',
          p.length ? `Registrert segmentlengde: ${Math.round(p.length)} m` : ''
        ].filter(Boolean).join(' · ');
        const privateNote = p.categoryCode === 'P'
          ? '<br><b>Privat veg:</b> Kontroller skilting og eventuell tillatelse før kjøring.' : '';
        layer.bindPopup(`<div class="popup-title">${escapeHtml(title)}</div><div class="popup-muted">${escapeHtml(details)}</div>${privateNote}<div class="popup-muted" style="margin-top:7px">Kilde: NVDB / Statens vegvesen</div>`);
      }
    }).addTo(map);

    let pinsLayer = L.layerGroup().addTo(map);
    let pinData = loadPins();
    let gpsMarker = null;
    let fetchTimer = null;
    let requestSerial = 0;
    let activeFetchController = null;
    let lastFetchKey = '';

    function showStatus(message, clearAfter = 0) {
      window.clearTimeout(showStatus.timer);
      statusEl.textContent = message || '';
      if (clearAfter) {
        showStatus.timer = window.setTimeout(() => { statusEl.textContent = ''; }, clearAfter);
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      }[ch]));
    }

    function loadPins() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(p => p && Number.isFinite(Number(p.lat)) && Number.isFinite(Number(p.lng)))
          .map((p, i) => ({
            id: p.id || `legacy-${i}-${Number(p.lat)}-${Number(p.lng)}`,
            lat:Number(p.lat), lng:Number(p.lng),
            name:String(p.name || p.title || 'Lagret plass'),
            note:String(p.note || p.description || ''),
            category:String(p.category || 'Leirplass')
          }));
      } catch (error) {
        console.warn('Kunne ikke lese lagrede steder:', error);
        return [];
      }
    }

    function savePins() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(pinData));
        return true;
      } catch (error) {
        showStatus('Kunne ikke lagre stedet lokalt. Sjekk lagringsplass eller nettleserinnstillinger.');
        return false;
      }
    }

    function drawMarkers() {
      pinsLayer.clearLayers();
      pinData.forEach(pin => {
        const marker = L.marker([pin.lat, pin.lng]);
        const popup = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'popup-title';
        title.textContent = pin.name;
        const category = document.createElement('div');
        category.className = 'popup-muted';
        category.textContent = pin.category;
        const note = document.createElement('div');
        note.className = 'popup-muted';
        note.style.marginTop = '5px';
        note.textContent = pin.note;
        const remove = document.createElement('button');
        remove.className = 'popup-action';
        remove.textContent = 'Slett lagret plass';
        remove.addEventListener('click', () => {
          if (!window.confirm('Vil du slette dette lagrede stedet?')) return;
          pinData = pinData.filter(item => item.id !== pin.id);
          savePins();
          drawMarkers();
          showStatus('Lagret plass slettet.', 2500);
        });
        popup.append(title, category, note, remove);
        marker.bindPopup(popup);
        marker.addTo(pinsLayer);
      });
    }

    function roadStyle(properties) {
      const code = properties.categoryCode;
      const colours = { E:'#d94b43', R:'#d94b43', F:'#e5a13b', K:'#53a0d8', P:'#54b477', S:'#54b477' };
      return {
        color:colours[code] || '#a8a8a8',
        weight:(code === 'E' || code === 'R') ? 5 : 3.5,
        opacity:0.9,
        lineCap:'round',
        lineJoin:'round'
      };
    }

    function addPinAt(latlng) {
      const name = window.prompt('Navn på stedet:', 'Ny plass');
      if (name === null) return;
      const cleanName = name.trim() || 'Lagret plass';
      const category = window.prompt('Kategori (f.eks. leirplass, utsikt, parkering, bom):', 'Leirplass');
      if (category === null) return;
      const note = window.prompt('Notat (valgfritt):', '') ?? '';
      pinData.push({
        id:`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,
        lat:Number(latlng.lat.toFixed(7)), lng:Number(latlng.lng.toFixed(7)),
        name:cleanName, category:category.trim() || 'Annet', note:note.trim()
      });
      if (savePins()) {
        drawMarkers();
        showStatus('Stedet er lagret på denne enheten.', 3000);
      }
    }

    addPinBtn.addEventListener('click', () => {
      addingPin = !addingPin;
      addPinBtn.classList.toggle('active', addingPin);
      showStatus(addingPin ? 'Trykk på kartet der du vil lagre et sted.' : 'Lagring av sted avbrutt.');
    });

    map.on('click', event => {
      if (!addingPin) return;
      addingPin = false;
      addPinBtn.classList.remove('active');
      addPinAt(event.latlng);
    });

    gpsBtn.addEventListener('click', () => {
      if (!navigator.geolocation) {
        showStatus('GPS er ikke tilgjengelig i denne nettleseren.');
        return;
      }
      showStatus('Henter GPS-posisjon …');
      navigator.geolocation.getCurrentPosition(position => {
        const point = [position.coords.latitude, position.coords.longitude];
        if (gpsMarker) map.removeLayer(gpsMarker);
        gpsMarker = L.circleMarker(point, {
          radius:8, color:'#ffffff', weight:3, fillColor:'#1976d2', fillOpacity:1
        }).addTo(map).bindPopup('Din GPS-posisjon');
        map.setView(point, Math.max(map.getZoom(), 15));
        gpsMarker.openPopup();
        showStatus('GPS-posisjon funnet.', 2500);
      }, error => {
        const messages = {
          1:'Du har ikke gitt nettleseren tilgang til posisjonen.',
          2:'GPS-posisjonen kunne ikke fastslås.',
          3:'Tidsavbrudd ved henting av GPS-posisjon.'
        };
        showStatus(messages[error.code] || 'Kunne ikke hente GPS-posisjon.');
      }, { enableHighAccuracy:true, timeout:15000, maximumAge:10000 });
    });

    layersBtn.addEventListener('click', () => {
      if (map.hasLayer(topoLayer)) {
        map.removeLayer(topoLayer);
        satelliteLayer.addTo(map);
        layersBtn.classList.add('active');
        showStatus('Satellittkart aktivt.', 2200);
      } else {
        map.removeLayer(satelliteLayer);
        topoLayer.addTo(map);
        layersBtn.classList.remove('active');
        showStatus('Topografisk kart aktivt.', 2200);
      }
    });

    function geometryToLatLngs(geometry) { return NvdbGeometry.parseWkt(geometry); }

    function segmentProperties(segment) {
      const vsr = segment.vegsystemreferanse || {};
      const system = vsr.vegsystem || {};
      const category = NvdbGeometry.categoryFor(segment);
      const address = segment.adresse || {};
      return {
        categoryCode:category.categoryCode,
        roadCategory:category.roadCategory,
        roadName:address.navn || segment.navn || '',
        reference:vsr.kortform || '',
        roadType:segment.typeVeg || '',
        length:Number(segment.lengde || segment.geometri?.lengde || 0),
        sequenceId:segment.veglenkesekvensid || '',
        segmentId:segment.segmentnummer || '',
        id:segment.referanse || ''
      };
    }

    function extractSegments(data) {
      if (Array.isArray(data)) return data;
      if (!data || typeof data !== 'object') return [];
      const possible = [data.objekter, data.segmenterteVeglenkesekvenser, data.segmenterte_veglenkesekvenser, data.veglenkesekvenser, data.veglenker, data.resultat];
      const found = possible.find(Array.isArray);
      if (!found) return [];
      // Støtter både segmentliste og svar der en sekvens inneholder en veglenke-liste.
      return found.flatMap(item => Array.isArray(item?.veglenker)
        ? item.veglenker.map(link => ({ ...item, ...link, veglenkesekvensid:item.veglenkesekvensid }))
        : [item]);
    }

    function nextPageStart(data) {
      const next = data?.metadata?.neste || data?.metadata?.next || data?.neste || data?.next;
      if (!next) return null;
      if (next.start !== undefined && next.start !== null) return String(next.start);
      const href = typeof next === 'string' ? next : next.href;
      if (href) {
        try { return new URL(href, NVDB_SEGMENT_URL).searchParams.get('start'); }
        catch (_) { return null; }
      }
      return null;
    }

    function currentBoundsKey() {
      const b = map.getBounds();
      return [b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].map(n => n.toFixed(4)).join(',') + `@${map.getZoom()}`;
    }

    async function fetchRoads(force = false) {
      if (!roadsEnabled) return;
      const key = currentBoundsKey();
      if (!force && key === lastFetchKey && roadLayer.getLayers().length) return;
      if (map.getZoom() < 9) {
        showStatus('Zoom inn til nivå 9 eller nærmere for å hente lokale veier.');
        return;
      }
      const bounds = map.getBounds();
      const west = Math.max(-180, bounds.getWest());
      const south = Math.max(-85, bounds.getSouth());
      const east = Math.min(180, bounds.getEast());
      const north = Math.min(85, bounds.getNorth());
      const bbox = [west,south,east,north].map(n => n.toFixed(7)).join(',');
      if (activeFetchController) activeFetchController.abort();
      const myRequest = ++requestSerial;
      lastFetchKey = key;
      showStatus('Henter segmenterte veier fra NVDB for kartutsnittet …');
      roadsBtn.classList.add('active');
      const collected = [];
      const seen = new Set();
      let start = null;
      let pageCount = 0;
      let rawSegmentCount = 0;
      let missingGeometryCount = 0;
      let lastResponseInfo = 'Ingen svarstruktur mottatt';
      let hasMorePages = false;
      const maxPages = 100;

      try {
        while (pageCount < maxPages) {
          if (myRequest !== requestSerial || !roadsEnabled) return;
          const url = new URL(NVDB_SEGMENT_URL);
          url.searchParams.set('kartutsnitt', bbox);
          url.searchParams.set('srid', '4326');
          url.searchParams.set('antall', '1000');
          url.searchParams.set('inkluderAntall', 'false');
          if (start) url.searchParams.set('start', start);

          const controller = new AbortController();
          activeFetchController = controller;
          const timeout = window.setTimeout(() => controller.abort(), 25000);
          let response;
          try {
            response = await fetch(url.toString(), {
              method:'GET', headers:NVDB_HEADERS, mode:'cors', cache:'no-store', signal:controller.signal
            });
          } finally {
            window.clearTimeout(timeout);
            if (activeFetchController === controller) activeFetchController = null;
          }
          if (!response.ok) {
            throw await NvdbGeometry.errorFromResponse(response);
          }
          const data = await response.json();
          if (myRequest !== requestSerial || !roadsEnabled) return;
          const segments = extractSegments(data);
          rawSegmentCount += segments.length;
          lastResponseInfo = Array.isArray(data)
            ? `Svar: array med ${data.length} elementer`
            : `Svarfelter: ${Object.keys(data || {}).join(', ') || 'ingen'}; listeelementer: ${segments.length}`;
          for (const segment of segments) {
            const props = segmentProperties(segment);
            const geometry = geometryToLatLngs(segment.geometri || segment.geometry);
            if (!geometry) { missingGeometryCount += 1; continue; }
            const id = `${props.sequenceId}:${props.segmentId}:${props.id}:${JSON.stringify(geometry.coordinates).slice(0,80)}`;
            if (seen.has(id)) continue;
            seen.add(id);
            collected.push({ type:'Feature', properties:props, geometry });
          }
          pageCount += 1;
          const next = nextPageStart(data);
          hasMorePages = pageCount === maxPages && Boolean(next);
          if (!next || next === start || segments.length === 0) break;
          start = next;
        }

        if (myRequest !== requestSerial) return;
        roadLayer.clearLayers();
        roadLayer.addData({ type:'FeatureCollection', features:collected });
        const hasMore = hasMorePages;
        if (!collected.length) {
          showStatus(`NVDB svarte, men ingen veglinjer kunne tegnes i dette kartutsnittet. ${lastResponseInfo}. Segmenter lest: ${rawSegmentCount}; uten geometri: ${missingGeometryCount}.`);
        } else {
          showStatus(`Viser ${collected.length} vegsegmenter fra NVDB${hasMore ? ' (visningen kan være avkortet – zoom inn for flere detaljer)' : ''}. Trykk på en vei for vegreferanse og detaljer.`, 7000);
        }
      } catch (error) {
        if (myRequest !== requestSerial) return;
        console.error('NVDB-feil:', error);
        roadLayer.clearLayers();
        lastFetchKey = '';
        const message = error.name === 'AbortError'
          ? 'NVDB brukte for lang tid på å svare. Prøv igjen.'
          : (error.message || 'Ukjent feil ved henting av NVDB-veier.');
        showStatus(`Kunne ikke hente NVDB-veiene. ${message}`);
      }
    }

    roadsBtn.addEventListener('click', () => {
      roadsEnabled = !roadsEnabled;
      roadsBtn.classList.toggle('active', roadsEnabled);
      legendEl.hidden = !roadsEnabled;
      if (roadsEnabled) fetchRoads(true);
      else {
        requestSerial += 1;
        if (activeFetchController) activeFetchController.abort();
        activeFetchController = null;
        roadLayer.clearLayers();
        showStatus('NVDB-veiene er skjult.');
      }
    });

    map.on('moveend', () => {
      if (!roadsEnabled) return;
      window.clearTimeout(fetchTimer);
      fetchTimer = window.setTimeout(() => fetchRoads(false), 800);
    });

    drawMarkers();

    // Hjelp nettleseren å oppdatere kartflaten etter at siden er ferdig vist.
    window.setTimeout(() => map.invalidateSize(), 250);
  })();
  </script>
</body>
</html>
