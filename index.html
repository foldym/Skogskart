
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17251c">
<title>Skogskart</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { box-sizing:border-box; }
body { margin:0; font-family:Arial,sans-serif; background:#17251c; color:white; }
header { height:55px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; }
header strong { font-size:20px; letter-spacing:1px; }
header span { color:#b5c9b4; font-size:11px; }
#map { height:calc(100dvh - 115px); width:100%; background:#dce5d3; }
footer { height:60px; display:flex; align-items:center; justify-content:space-around; gap:5px; padding:5px; }
button { background:#344c3b; color:white; border:1px solid #607664; border-radius:9px; padding:10px 9px; font-size:12px; font-weight:bold; white-space:nowrap; }
button.active { background:#a0b77e; color:#17251c; }
button:disabled { opacity:.55; }
#status { position:absolute; z-index:800; bottom:68px; left:10px; right:10px; width:max-content; max-width:calc(100% - 20px); background:#17251cee; color:#fff; padding:8px 12px; border-radius:8px; font-size:11px; line-height:1.4; pointer-events:none; }
#legend { display:none; position:absolute; z-index:800; top:63px; left:10px; background:#17251cee; padding:9px 11px; border-radius:8px; font-size:11px; line-height:1.9; }
.swatch { display:inline-block; width:23px; height:5px; margin-right:7px; vertical-align:middle; border-radius:3px; }
.marker { font-size:27px; text-align:center; }
.leaflet-popup-content button { color:white; background:#344c3b; border:0; padding:7px 10px; }
.leaflet-interactive { cursor:pointer; }
</style>
</head>
<body>
<header>
<strong>🌲 SKOGSKART</strong>
<span>DITT TURKART · NORGE</span>
</header>
<div id="map"></div>
<div id="status">Kartverket · Topografisk kart</div>
<div id="legend">
<div><i class="swatch" style="background:#2485f5"></i>Offentlig hovedvei</div>
<div><i class="swatch" style="background:#c7d3dc"></i>Fylkes-/kommunal vei</div>
<div><i class="swatch" style="background:#ff9d22"></i>Privat vei</div>
<div><i class="swatch" style="background:#42c66b"></i>Skogsbilvei</div>
<div><i class="swatch" style="background:#d66bdb"></i>Ukjent kategori</div>
</div>
<footer>
<button id="add">📍 Lagre plass</button>
<button id="gps">◎ GPS</button>
<button id="layers">🗺 Kartlag</button>
<button id="roads">🛣 Veier</button>
</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.min.js"></script>
<script>
const map = L.map('map').setView([58.3308,8.2323],12);
const statusBox = document.getElementById('status');

const topo = L.tileLayer.wms(
  'https://wms.geonorge.no/skwms1/wms.topo',
  {layers:'topo',format:'image/png',transparent:false,version:'1.3.0',attribution:'Kartverket / Geonorge'}
);
const satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {attribution:'Esri, Maxar, Earthstar Geographics'}
);
topo.addTo(map);

const saved = JSON.parse(localStorage.getItem('skogskart') || '[]');
let markers = [];
let adding = false;
let satelliteOn = false;
let roadsLayer = null;
let roadsVisible = false;
let roadsLoading = false;

// NVDB can return ETRS89 / UTM coordinates.
const utm33 = '+proj=utm +zone=33 +ellps=GRS80 +units=m +no_defs +type=crs';
const utm32 = '+proj=utm +zone=32 +ellps=GRS80 +units=m +no_defs +type=crs';
proj4.defs('EPSG:5973',utm33);
proj4.defs('EPSG:6173',utm33);
proj4.defs('EPSG:25833',utm33);
proj4.defs('EPSG:25832',utm32);
proj4.defs('EPSG:32633','+proj=utm +zone=33 +datum=WGS84 +units=m +no_defs +type=crs');
proj4.defs('EPSG:32632','+proj=utm +zone=32 +datum=WGS84 +units=m +no_defs +type=crs');

function saveData() {
  localStorage.setItem('skogskart',JSON.stringify(saved));
}

function escapeText(s) {
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function drawMarkers() {
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  saved.forEach((p,i)=>{
    const marker=L.marker([p.lat,p.lng],{
      icon:L.divIcon({
        className:'marker',
        html:'⛺',
        iconSize:[32,32],
        iconAnchor:[16,16]
      })
    }).addTo(map);

    marker.bindPopup(
      '<b>⛺ '+escapeText(p.name)+'</b><br>'+
      escapeText(p.note || 'Eget tursted')+
      '<br><button onclick="deletePlace('+i+')">Slett stedet</button>'
    );
    markers.push(marker);
  });
}

window.deletePlace=function(i) {
  if(confirm('Slette dette stedet?')) {
    saved.splice(i,1);
    saveData();
    drawMarkers();
  }
};

document.getElementById('add').onclick=function(){
  adding=!adding;
  this.classList.toggle('active',adding);
  statusBox.textContent=adding
    ?'Trykk på kartet for å lagre et sted'
    :'Kartverket · Topografisk kart';
};

map.on('click',function(e){
  if(!adding)return;
  const name=prompt('Navn på teltplassen:','Min teltplass');
  if(!name)return;
  const note=prompt('Notat (valgfritt):','');

  saved.push({
    name:name,
    note:note || '',
    lat:e.latlng.lat,
    lng:e.latlng.lng
  });

  saveData();
  drawMarkers();
  adding=false;
  document.getElementById('add').classList.remove('active');
  statusBox.textContent='Plass lagret!';
});

document.getElementById('gps').onclick=function(){
  if(!navigator.geolocation){
    alert('GPS støttes ikke.');
    return;
  }

  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;
    map.setView([lat,lng],16);

    L.circleMarker([lat,lng],{
      radius:9,
      color:'#fff',
      weight:3,
      fillColor:'#2679e8',
      fillOpacity:1
    }).addTo(map).bindPopup('Din posisjon').openPopup();

  },()=>{
    alert('Fikk ikke tilgang til GPS. Kontroller stedstjenester.');
  },{
    enableHighAccuracy:true,
    timeout:15000
  });
};

document.getElementById('layers').onclick=function(){
  satelliteOn=!satelliteOn;

  if(satelliteOn){
    map.removeLayer(topo);
    satellite.addTo(map);
    this.textContent='🗺 Norgeskart';
    statusBox.textContent='Satellittbilder · Esri';
  } else {
    map.removeLayer(satellite);
    topo.addTo(map);
    this.textContent='🗺 Kartlag';
    statusBox.textContent='Kartverket · Topografisk kart';
  }
};

// Hent vegsegmenter, både direkte og fra sekvenser med nøstede veglenker.
function extractSegments(data) {
  let items=[];

  if(Array.isArray(data)) items=data;
  else if(Array.isArray(data?.objekter)) items=data.objekter;
  else if(Array.isArray(data?.veglenkesekvenser)) items=data.veglenkesekvenser;
  else if(Array.isArray(data?.features)) items=data.features;

  const flat=[];

  for(const item of items) {
    if(item?.geometri?.wkt || item?.geometri?.verdi) {
      flat.push(item);
    } else if(Array.isArray(item?.veglenker)) {
      for(const link of item.veglenker) {
        flat.push({
          ...link,
          vegsystemreferanse:item.vegsystemreferanse || link.vegsystemreferanse,
          adresse:item.adresse || link.adresse,
          veglenkesekvensid:item.veglenkesekvensid
        });
      }
    }
  }
  return flat;
}

// Leser LINESTRING og MULTILINESTRING fra WKT.
function parseWktLines(wkt) {
  if(typeof wkt!=='string') return [];

  const groups=[...wkt.matchAll(/\(([^()]+)\)/g)].map(m=>m[1]);
  if(!groups.length) return [];

  return groups.map(group=>
    group.split(',').map(pair=>{
      const nums=pair.trim().split(/\s+/).map(Number);
      if(nums.length<2 ||
         !Number.isFinite(nums[0]) ||
         !Number.isFinite(nums[1])) return null;
      return [nums[0],nums[1]];
    }).filter(Boolean)
  ).filter(line=>line.length>=2);
}

// Gjør om NVDB-koordinater til lengdegrad/breddegrad.
function toLonLat(x,y,srid) {
  const code=Number(srid);

  if(code===4326) return [x,y];

  let source='EPSG:5973';

  if(code===25832 || code===32632) {
    source='EPSG:'+code;
  } else if(
    code===25833 || code===32633 ||
    code===6173 || code===5973
  ) {
    source='EPSG:'+code;
  } else if(code) {
    throw new Error('Ukjent koordinatsystem i NVDB-dataene: EPSG:'+code);
  }

  const point=proj4(source,'EPSG:4326',[x,y]);
  return [point[0],point[1]];
}

function roadCategory(segment) {
  return segment?.vegsystemreferanse?.vegsystem?.vegkategori ||
    segment?.vegsystemreferanse?.vegkategori || 'U';
}

function roadCategoryName(category) {
  return ({
    E:'Europavei',
    R:'Riksvei',
    F:'Fylkesvei',
    K:'Kommunal vei',
    P:'Privat vei',
    S:'Skogsbilvei',
    U:'Ukjent vegkategori'
  })[category] || 'Ukjent vegkategori';
}

// Tydelige farger og tykkere linjer som er lettere å trykke på.
function roadStyle(category) {
  if(category==='P')
    return {color:'#ff9d22',weight:8,opacity:1,lineCap:'round',lineJoin:'round'};

  if(category==='S')
    return {color:'#42c66b',weight:8,opacity:1,lineCap:'round',lineJoin:'round'};

  if(category==='E' || category==='R')
    return {color:'#2485f5',weight:7,opacity:1,lineCap:'round',lineJoin:'round'};

  if(category==='F' || category==='K')
    return {color:'#c7d3dc',weight:7,opacity:1,lineCap:'round',lineJoin:'round'};

  return {color:'#d66bdb',weight:7,opacity:1,dashArray:'5 4',lineCap:'round',lineJoin:'round'};
}

async function loadRoads() {
  const button=document.getElementById('roads');

  if(roadsLoading) return;

  if(roadsVisible && roadsLayer) {
    map.removeLayer(roadsLayer);
    roadsVisible=false;
    document.getElementById('legend').style.display='none';
    button.classList.remove('active');
    button.textContent='🛣 Veier';
    statusBox.textContent='Veilaget er skjult';
    return;
  }

  if(roadsLayer) {
    roadsLayer.addTo(map);
    roadsLayer.bringToFront();
    roadsVisible=true;
    document.getElementById('legend').style.display='block';
    button.classList.add('active');
    button.textContent='🛣 Skjul veier';
    statusBox.textContent='NVDB-veier vises. Trykk på en farget linje for informasjon.';
    return;
  }

  roadsLoading=true;
  button.disabled=true;
  statusBox.textContent='Henter veglinjer fra NVDB …';

  try {
    const bounds=map.getBounds();

    const bbox=[
      bounds.getWest(),
      bounds.getSouth(),
      bounds.getEast(),
      bounds.getNorth()
    ].map(n=>n.toFixed(6)).join(',');

    const params=new URLSearchParams({
  kommune:'4216',
  srid:'4326',
  antall:'1000',
  inkluderAntall:'false'
});

const url=
  'https://nvdbapiles.atlas.vegvesen.no/vegnett/api/v4/veglenkesekvenser?'+
  params.toString();
    const response=await fetch(url,{
      method:'GET',
      headers:{
        'X-Client':'Skogskart foldym.github.io',
        'Accept':'application/json'
      }
    });

    if(!response.ok) {
      const detail=await response.text().catch(()=> '');
      throw new Error(
        'NVDB svarte HTTP '+response.status+
        (detail?' – '+detail.slice(0,180):'')
      );
    }

    const data=await response.json();
    const segments=extractSegments(data);
    const features=[];
    const srids={};
    const counts={};

    for(const segment of segments) {
      const geometry=segment?.geometri;
      const wkt=geometry?.wkt || geometry?.verdi;
      const lines=parseWktLines(wkt);

      if(!lines.length) continue;

      const firstPair=lines[0][0];
      const inferredSrid=
        (Math.abs(firstPair[0])<=180 && Math.abs(firstPair[1])<=90)
        ?4326:5973;
      const srid=geometry?.srid || inferredSrid;

      srids[srid]=(srids[srid]||0)+1;

      const category=roadCategory(segment);
      counts[category]=(counts[category]||0)+1;

      const converted=lines.map(line=>
        line.map(pair=>toLonLat(pair[0],pair[1],srid))
      );

      features.push({
        type:'Feature',
        geometry:{
          type:'MultiLineString',
          coordinates:converted
        },
        properties:{
          category:category,
          name:roadCategoryName(category),
          reference:segment?.vegsystemreferanse?.kortform || '',
          address:segment?.adresse?.navn || '',
          roadType:segment?.typeVeg || '',
          length:segment?.lengde || geometry?.lengde || null,
          srid:srid
        }
      });
    }

    if(!features.length) {
      const count=Array.isArray(data?.objekter)
        ?data.objekter.length
        :Array.isArray(data)?data.length:0;

      throw new Error(
        'NVDB svarte, men fant ingen brukbare veglinjer. Poster mottatt: '+
        count+'. Se eventuelle API-detaljer i konsollen.'
      );
    }

    roadsLayer=L.geoJSON({
      type:'FeatureCollection',
      features:features
    },{
      pane:'overlayPane',
      attribution:'Data: Statens vegvesen / NVDB · NLOD',
      style:feature=>roadStyle(feature.properties.category),

      onEachFeature:(feature,layer)=>{
        const p=feature.properties;

        const details=[
          '<b>'+escapeText(p.name)+'</b>',
          p.address?escapeText(p.address):'',
          p.reference?escapeText(p.reference):'',
          p.roadType?'Vegtype: '+escapeText(p.roadType):'',
          p.length?'Lengde på segment: '+Math.round(p.length)+' m':'',
          '<small>Datakilde: NVDB</small>'
        ].filter(Boolean).join('<br>');

        layer.bindPopup(details,{closeButton:true,autoPan:true});

        layer.on('mouseover',()=>{
          layer.setStyle({...roadStyle(p.category),weight:11});
        });

        layer.on('mouseout',()=>{
          layer.setStyle(roadStyle(p.category));
        });
      }
    }).addTo(map);

    roadsLayer.bringToFront();
    roadsVisible=true;
    document.getElementById('legend').style.display='block';
    button.classList.add('active');
    button.textContent='🛣 Skjul veier';

    const categorySummary=Object.entries(counts)
      .map(([key,val])=>key+': '+val).join(' · ');
    const sridSummary=Object.keys(srids).join(', ');

    statusBox.textContent=
      'NVDB: '+features.length+' veglinjer · EPSG '+sridSummary+
      ' · '+categorySummary+
      ' · Trykk på linjen for detaljer.';

  } catch(error) {
    console.error('Skogskart NVDB-feil:',error);
    statusBox.textContent='NVDB-feil: '+error.message;

    alert(
      'Kunne ikke vise NVDB-veiene.\n\n'+
      error.message+
      '\n\nKartet og de lagrede stedene er beholdt.'
    );

  } finally {
    roadsLoading=false;
    button.disabled=false;
  }
}

document.getElementById('roads').onclick=loadRoads;
drawMarkers();
</script>
</body>
</html>
