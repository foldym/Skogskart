
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17251c">
<title>Skogskart</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { box-sizing:border-box; }
body { margin:0; font-family:Arial,sans-serif; background:#17251c; color:white; }
header { height:55px; display:flex; align-items:center; justify-content:space-between; padding:0 15px; }
header strong { font-size:20px; letter-spacing:1px; }
header span { color:#b5c9b4; font-size:11px; }
#map { height:calc(100dvh - 115px); width:100%; background:#dce5d3; }
footer { height:60px; display:flex; align-items:center; justify-content:space-around; gap:6px; padding:5px; }
button { background:#344c3b; color:white; border:1px solid #607664; border-radius:9px; padding:11px 13px; font-size:13px; font-weight:bold; }
button.active { background:#a0b77e; color:#17251c; }
#status { position:absolute; z-index:500; bottom:72px; left:10px; background:#17251cdd; padding:8px 12px; border-radius:8px; font-size:11px; }
.marker { font-size:27px; text-align:center; }
</style>
</head>
<body>
<header>
<strong>🌲 SKOGSKART</strong>
<span>DITT TURKART · NORGE</span>
</header>
<div id="map"></div>
<div id="status">Kartverket · Topografisk kart</div>
<footer>
<button id="add">📍 Lagre plass</button>
<button id="gps">◎ GPS</button>
<button id="layers">🗺 Kartlag</button>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([58.712273,8.343777],12);

const topo = L.tileLayer.wms(
'https://wms.geonorge.no/skwms1/wms.topo',
{
layers:'topo',
format:'image/png',
transparent:false,
version:'1.3.0',
attribution:'Kartverket / Geonorge'
});

const satellite = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{ attribution:'Esri, Maxar, Earthstar Geographics' }
);

topo.addTo(map);

const saved = JSON.parse(localStorage.getItem('skogskart') || '[]');
let markers = [];
let adding = false;

function saveData() {
localStorage.setItem('skogskart',JSON.stringify(saved));
}

function drawMarkers() {
markers.forEach(m=>map.removeLayer(m));
markers=[];
saved.forEach((p,i)=>{
const marker=L.marker([p.lat,p.lng],{
icon:L.divIcon({
className:'marker',
html:'⛺',
iconSize:[32,32],
iconAnchor:[16,16]
})
}).addTo(map);
marker.bindPopup(
'<b>⛺ '+escapeText(p.name)+'</b><br>'+escapeText(p.note || 'Eget tursted')+
'<br><button onclick="deletePlace('+i+')">Slett stedet</button>'
);
markers.push(marker);
});
}

function escapeText(s) {
return String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));
}

window.deletePlace=function(i) {
if(confirm('Slette dette stedet?')) {
saved.splice(i,1);
saveData();
drawMarkers();
}
};

document.getElementById('add').onclick=function(){
adding=!adding;
this.classList.toggle('active',adding);
document.getElementById('status').textContent=
adding?'Trykk på kartet for å lagre et sted':'Kartverket · Topografisk kart';
};

map.on('click',function(e){
if(!adding)return;
const name=prompt('Navn på teltplassen:','Min teltplass');
if(!name)return;
const note=prompt('Notat (valgfritt):','');
saved.push({
name:name,
note:note || '',
lat:e.latlng.lat,
lng:e.latlng.lng
});
saveData();
drawMarkers();
adding=false;
document.getElementById('add').classList.remove('active');
document.getElementById('status').textContent='Plass lagret!';
});

document.getElementById('gps').onclick=function(){
if(!navigator.geolocation){
alert('GPS støttes ikke.');
return;
}
navigator.geolocation.getCurrentPosition(pos=>{
const lat=pos.coords.latitude;
const lng=pos.coords.longitude;
map.setView([lat,lng],16);
L.circleMarker([lat,lng],{
radius:9,color:'#fff',weight:3,fillColor:'#2679e8',fillOpacity:1
}).addTo(map).bindPopup('Din posisjon').openPopup();
},()=>alert('Fikk ikke tilgang til GPS. Kontroller stedstjenester.'),{
enableHighAccuracy:true,timeout:15000
});
};

let satelliteOn=false;
document.getElementById('layers').onclick=function(){
satelliteOn=!satelliteOn;
if(satelliteOn){
map.removeLayer(topo);
satellite.addTo(map);
this.textContent='🗺 Norgeskart';
document.getElementById('status').textContent='Satellittbilder · Esri';
}else{
map.removeLayer(satellite);
topo.addTo(map);
this.textContent='🗺 Kartlag';
document.getElementById('status').textContent='Kartverket · Topografisk kart';
}
};

drawMarkers();
</script>
</body>
</html>
